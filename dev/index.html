<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>family-week-planner-card · Dev</title>
    <style>
      :root {
        --primary-color: #03a9f4;
        --primary-text-color: #e6e6e6;
        --card-background-color: #1c1f24;
        --ha-card-background: #1c1f24;
      }
      html,
      body {
        margin: 0;
        background: #0e1013;
        color: #e6e6e6;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .bar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 16px;
        border-bottom: 1px solid #262a30;
        font-size: 13px;
      }
      .bar button {
        background: #23272e;
        color: #e6e6e6;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .bar .log {
        opacity: 0.7;
      }
      /* Simulate the portrait mirror column */
      .stage {
        max-width: 1040px;
        margin: 18px auto;
        padding: 0 12px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <strong>family-week-planner-card</strong>
      <button id="dump">Store in Konsole</button>
      <button id="editor">Editor ein/aus</button>
      <span class="log" id="log">bereit</span>
    </div>
    <div class="stage" id="stage"></div>
    <div class="stage" id="editorStage" style="max-width: 760px"></div>

    <script type="module">
      await import("/dist/family-week-planner-card.js");

      /* ---------- date helpers (mirror the card's local logic) ---------- */
      const pad = (n) => String(n).padStart(2, "0");
      const mondayOf = (date) => {
        const x = new Date(date);
        const day = (x.getDay() + 6) % 7;
        x.setDate(x.getDate() - day);
        x.setHours(0, 0, 0, 0);
        return x;
      };
      const addDays = (d, n) => {
        const x = new Date(d);
        x.setDate(x.getDate() + n);
        return x;
      };
      const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const MON = mondayOf(new Date());
      const at = (off, h, m) => {
        const d = addDays(MON, off);
        d.setHours(h, m, 0, 0);
        return d;
      };

      const log = (m) => (document.getElementById("log").textContent = m);
      let idc = 100;
      const nextUid = () => `mock-${idc++}`;

      const timed = (off, h1, m1, h2, m2, summary) => ({
        uid: nextUid(),
        summary,
        start: { dateTime: at(off, h1, m1).toISOString() },
        end: { dateTime: at(off, h2, m2).toISOString() },
      });
      const allday = (off, summary, span = 1) => ({
        uid: nextUid(),
        summary,
        start: { date: ymd(addDays(MON, off)) },
        end: { date: ymd(addDays(MON, off + span)) },
      });

      // In-memory calendar the mock reads/writes so CRUD is visible on reload.
      // Fictional demo names — real household names live only in the dashboard config.
      // Entries with `rrule` are series masters (like one CalDAV resource): the engine below
      // expands them and keeps per-instance overrides / EXDATEs / UNTIL like the ical backend.
      let STORE = [
        timed(0, 7, 0, 8, 0, "Anna|Sport: Joggen"),
        timed(0, 20, 0, 22, 0, "Anna|Tanzen: Tanzkurs"),
        timed(0, 8, 0, 12, 0, "Ben|Schule: Lernen"),
        allday(1, "Familie|Ausflug: Zoo"),
        timed(2, 15, 30, 16, 30, "Carla|Schule: Ballett"),
        { ...timed(1 - 21, 18, 15, 19, 30, "Ben|Sport: Fussball"), rrule: "FREQ=WEEKLY;BYDAY=TU" },
        { ...timed(0 - 14, 12, 0, 13, 0, "Essen|Mittag: Mittagessen"), rrule: "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR" },
        { ...timed(3, 20, 0, 22, 0, "Anna|Chor: Chorprobe"), rrule: "FREQ=WEEKLY;INTERVAL=2" },
        { ...allday(4 - 7, "Rest|Ausflug: Müll rausstellen"), rrule: "FREQ=WEEKLY" },
        allday(5, "Ausflug See"),
        timed(6, 10, 0, 10, 30, "David|Arzt: Zahnarzt"),
      ];

      // To-do lists (HA `todo` domain): {uid, summary, status, due, description}.
      // "Familienaufgaben" uses the Person|Icon: convention; "Arbeit" mimics an external list
      // (e.g. Microsoft To Do) whose titles carry no prefix -> fixed person/icon in the card config.
      const TODAY = new Date();
      TODAY.setHours(0, 0, 0, 0);
      const dayOff = (n) => ymd(addDays(TODAY, n));
      const TODOS = {
        "todo.familienaufgaben": [
          { uid: "t1", summary: "Rest|Aufgabe: Katzenklo", status: "needs_action", due: dayOff(0), description: "↻ täglich" },
          { uid: "t2", summary: "Ben|Aufgabe: Zimmer aufräumen", status: "needs_action", due: ymd(addDays(MON, 5)), description: "↻ wöchentlich" },
          { uid: "t3", summary: "Anna|Müll: Müll rausbringen", status: "needs_action", due: dayOff(-2), description: "↻ Mo, Do\nBlaue Tonne" },
          { uid: "t4", summary: "Familie: Blumen giessen", status: "needs_action", description: "" },
          { uid: "t5", summary: "Carla|Aufgabe: Hausaufgaben", status: "completed", due: dayOff(-1), description: "↻ Mo–Fr" },
          { uid: "t6", summary: "David: Altglas", status: "completed", due: dayOff(-20), description: "" },
        ],
        "todo.arbeit": [
          { uid: "w1", summary: "Architektur prüfen", status: "needs_action", due: dayOff(1) },
          { uid: "w2", summary: "Review Sprint-Board", status: "needs_action", due: dayOff(0), description: "↻ wöchentlich" },
        ],
      };
      let tid = 500;
      const findTodo = (entity, ref) => (TODOS[entity] || []).find((x) => x.uid === ref || x.summary === ref);

      const toDate = (o) => (o.dateTime ? new Date(o.dateTime) : new Date(o.date + "T00:00:00"));
      const clone = (o) => JSON.parse(JSON.stringify(o));

      /* ---------- mini recurrence engine (mirrors the ical-based backend) ---------- */
      const BYD = ["MO", "TU", "WE", "TH", "FR", "SA", "SU"];
      const parseRR = (s) =>
        Object.fromEntries(
          String(s || "")
            .split(";")
            .filter(Boolean)
            .map((p) => {
              const i = p.indexOf("=");
              return [p.slice(0, i).toUpperCase(), p.slice(i + 1).toUpperCase()];
            })
        );
      const serRR = (o) =>
        Object.entries(o)
          .filter(([, v]) => v)
          .map(([k, v]) => `${k}=${v}`)
          .join(";");
      // recurrence_id like ical: YYYYMMDDTHHMMSS (floating local) or YYYYMMDD for all-day
      const fmtRid = (d, isAllday) =>
        `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}` +
        (isAllday ? "" : `T${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`);
      const parseRid = (rid) =>
        new Date(+rid.slice(0, 4), +rid.slice(4, 6) - 1, +rid.slice(6, 8), +(rid.slice(9, 11) || 0), +(rid.slice(11, 13) || 0), +(rid.slice(13, 15) || 0));
      const parseUntil = (u) =>
        u.endsWith("Z")
          ? new Date(Date.UTC(+u.slice(0, 4), +u.slice(4, 6) - 1, +u.slice(6, 8), +(u.slice(9, 11) || 0), +(u.slice(11, 13) || 0), +(u.slice(13, 15) || 0)))
          : parseRid(u);
      const fmtUntil = (d) =>
        `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;
      const withUntil = (rrule, untilDate) => {
        const p = parseRR(rrule);
        delete p.COUNT;
        p.UNTIL = fmtUntil(untilDate);
        return serRR(p);
      };

      function occurrences(master, rangeStart, rangeEnd) {
        const s0 = toDate(master.start);
        const e0 = master.end ? toDate(master.end) : addDays(s0, 1);
        const dur = e0 - s0;
        const rr = parseRR(master.rrule);
        const interval = Math.max(1, +(rr.INTERVAL || 1));
        const until = rr.UNTIL ? parseUntil(rr.UNTIL) : null;
        const count = rr.COUNT ? +rr.COUNT : Infinity;
        const out = [];
        let n = 0;
        const push = (d) => {
          if (until && d > until) return false;
          if (n >= count) return false;
          n++;
          const e = new Date(d.getTime() + dur);
          if (d < rangeEnd && e > rangeStart) out.push({ start: d, end: e });
          return true;
        };
        if (rr.FREQ === "WEEKLY" && rr.BYDAY) {
          const days = rr.BYDAY.split(",")
            .map((x) => BYD.indexOf(x))
            .filter((i) => i >= 0)
            .sort();
          const weekStart = mondayOf(s0);
          for (let w = 0; w < 500; w++) {
            const base = addDays(weekStart, w * 7 * interval);
            if (base > rangeEnd) break;
            for (const di of days) {
              const d = addDays(base, di);
              d.setHours(s0.getHours(), s0.getMinutes(), s0.getSeconds(), 0);
              if (d < s0) continue;
              if (push(d) === false) return out;
            }
          }
          return out;
        }
        for (let i = 0; i < 2000; i++) {
          const d = new Date(s0);
          if (rr.FREQ === "DAILY") d.setDate(s0.getDate() + i * interval);
          else if (rr.FREQ === "WEEKLY") d.setDate(s0.getDate() + 7 * i * interval);
          else if (rr.FREQ === "MONTHLY") d.setMonth(s0.getMonth() + i * interval);
          else if (rr.FREQ === "YEARLY") d.setFullYear(s0.getFullYear() + i * interval);
          else return out;
          if (d >= rangeEnd) break;
          if (push(d) === false) break;
        }
        return out;
      }

      function expandAll(rangeStart, rangeEnd) {
        const out = [];
        const overlaps = (ev) => {
          const s = toDate(ev.start);
          const e = ev.end ? toDate(ev.end) : addDays(s, 1);
          return s < rangeEnd && e > rangeStart;
        };
        for (const m of STORE) {
          if (!m.rrule) {
            if (overlaps(m)) out.push(clone(m));
            continue;
          }
          const isAllday = !!m.start.date;
          // widen the window so overrides moved into/out of the week are handled
          for (const occ of occurrences(m, addDays(rangeStart, -60), addDays(rangeEnd, 60))) {
            const rid = fmtRid(occ.start, isAllday);
            if ((m.exdates || []).includes(rid)) continue;
            const ov = (m.overrides || {})[rid];
            const ev = ov
              ? { ...clone(ov), uid: m.uid, recurrence_id: rid, rrule: m.rrule }
              : {
                  uid: m.uid,
                  summary: m.summary,
                  description: m.description,
                  rrule: m.rrule,
                  recurrence_id: rid,
                  start: isAllday ? { date: ymd(occ.start) } : { dateTime: occ.start.toISOString() },
                  end: isAllday ? { date: ymd(occ.end) } : { dateTime: occ.end.toISOString() },
                };
            if (overlaps(ev)) out.push(ev);
          }
        }
        return out;
      }

      const mockHass = {
        language: "de",
        states: {
          "calendar.familie": { state: "on", last_updated: new Date().toISOString(), attributes: {} },
          // optional rows helper (used when the page is opened with ?rows): no "Rest" -> auto-appended
          "input_select.familienplaner_zeilen": {
            state: "Familie:#7e57c2",
            last_updated: new Date().toISOString(),
            attributes: { friendly_name: "Familienplaner Zeilen", options: ["Familie:#7e57c2", "Anna:#1e88e5", "Ben", "Carla:0,137,123", "Essen:#6d4c41"] },
          },
          "todo.familienaufgaben": { state: "4", last_updated: new Date().toISOString(), attributes: { friendly_name: "Familienaufgaben" } },
          "todo.arbeit": { state: "2", last_updated: new Date().toISOString(), attributes: { friendly_name: "Arbeit" } },
          // icon map maintained as an input_select helper ("Word:Emoji" options)
          "input_select.familienplaner_icons": {
            state: "Sport:🏋️",
            last_updated: new Date().toISOString(),
            attributes: { options: ["Sport:🏋️", "Tanzen:💃", "Singen:🎵", "Chor:🎶", "Arzt:🩺", "Schule:🎒", "Ausflug:🧭", "Mittag:🍴", "Ferien:🏖️"] },
          },
        },
        localize: (k) => k,
        async callApi(method, path) {
          const q = new URLSearchParams(path.split("?")[1] || "");
          const out = expandAll(new Date(q.get("start")), new Date(q.get("end")));
          log(`GET ${method} → ${out.length} Termine`);
          return out;
        },
        // HA service calls used by the card: todo.add_item / update_item / remove_item
        async callService(domain, service, data, target) {
          const entity = target && target.entity_id;
          if (domain !== "todo" || !TODOS[entity]) throw new Error(`unknown service ${domain}.${service} / ${entity}`);
          const list = TODOS[entity];
          if (service === "add_item") {
            list.push({ uid: `t${tid++}`, summary: data.item, status: "needs_action", due: data.due_date, description: data.description || "" });
            log(`todo.add_item "${data.item}" due ${data.due_date}${data.description ? " (" + data.description.split("\n")[0] + ")" : ""}`);
          } else if (service === "update_item") {
            const it = findTodo(entity, data.item);
            if (!it) throw new Error(`Unable to find to-do list item: ${data.item}`);
            if (data.rename !== undefined) it.summary = data.rename;
            if (data.status !== undefined) it.status = data.status;
            if (data.due_date !== undefined) it.due = data.due_date;
            if (data.description !== undefined) it.description = data.description;
            log(`todo.update_item ${it.uid}: ${JSON.stringify({ ...data, item: undefined })}`);
          } else if (service === "remove_item") {
            const i = list.findIndex((x) => x.uid === data.item || x.summary === data.item);
            if (i >= 0) list.splice(i, 1);
            log(`todo.remove_item ${data.item}`);
          } else throw new Error(`unsupported todo service ${service}`);
          mockHass.states[entity] = { ...mockHass.states[entity], state: String(list.filter((x) => x.status !== "completed").length), last_updated: new Date().toISOString() };
          return {};
        },
        async callWS(msg) {
          if (msg.type === "todo/item/list") {
            return { items: clone(TODOS[msg.entity_id] || []) };
          }
          if (msg.type === "calendar/event/create") {
            const ev = { ...fromWs(msg.event), uid: nextUid() };
            if (msg.event.rrule) ev.rrule = msg.event.rrule;
            STORE.push(ev);
            log(`create: "${msg.event.summary}"${ev.rrule ? " (" + ev.rrule + ")" : ""}`);
            return {};
          }
          if (msg.type === "calendar/event/update") {
            const m = STORE.find((e) => e.uid === msg.uid);
            if (!m) throw new Error(`No event found with UID ${msg.uid}`);
            const ev = fromWs(msg.event);
            if (msg.recurrence_id && m.rrule) {
              if (msg.recurrence_range === "THISANDFUTURE") {
                const splitAt = parseRid(msg.recurrence_id);
                const firstStart = toDate(m.start);
                if (splitAt <= firstStart) {
                  // editing from the first instance = editing the whole series
                  Object.assign(m, ev, { rrule: msg.event.rrule || m.rrule });
                  log(`update series ${msg.uid} (from first instance)`);
                  return {};
                }
                const newRule = msg.event.rrule || m.rrule;
                m.rrule = withUntil(m.rrule, new Date(splitAt.getTime() - 86400000));
                for (const rid of Object.keys(m.overrides || {})) if (parseRid(rid) >= splitAt) delete m.overrides[rid];
                STORE.push({ ...ev, uid: nextUid(), rrule: newRule });
                log(`split ${msg.uid} at ${msg.recurrence_id} → new series`);
              } else {
                if (msg.event.rrule) throw new Error("Can't update single instance with rrule");
                m.overrides = m.overrides || {};
                m.overrides[msg.recurrence_id] = ev;
                log(`override ${msg.uid}@${msg.recurrence_id}: "${msg.event.summary}"`);
              }
              return {};
            }
            Object.assign(m, ev, msg.event.rrule !== undefined ? { rrule: msg.event.rrule } : {});
            log(`update ${msg.uid}: "${msg.event.summary}"`);
            return {};
          }
          if (msg.type === "calendar/event/delete") {
            const m = STORE.find((e) => e.uid === msg.uid);
            if (m && msg.recurrence_id && m.rrule) {
              const splitAt = parseRid(msg.recurrence_id);
              if (msg.recurrence_range === "THISANDFUTURE") {
                if (splitAt <= toDate(m.start)) STORE = STORE.filter((e) => e !== m);
                else {
                  m.rrule = withUntil(m.rrule, new Date(splitAt.getTime() - 86400000));
                  for (const rid of Object.keys(m.overrides || {})) if (parseRid(rid) >= splitAt) delete m.overrides[rid];
                }
                log(`delete ${msg.uid} from ${msg.recurrence_id} on`);
              } else {
                (m.exdates = m.exdates || []).push(msg.recurrence_id);
                if (m.overrides) delete m.overrides[msg.recurrence_id];
                log(`exdate ${msg.uid}@${msg.recurrence_id}`);
              }
              return {};
            }
            STORE = STORE.filter((e) => e.uid !== msg.uid);
            log(`delete ${msg.uid}`);
            return {};
          }
          log(`callWS ${msg.type}`);
          return {};
        },
      };

      // Convert a WS event ({summary,dtstart,dtend}) back into REST start/end objects.
      function fromWs(ev) {
        const isDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s);
        const mk = (s) => {
          if (isDate(s)) return { date: s };
          const [datePart, timePart] = s.split(" ");
          const [y, m, d] = datePart.split("-").map(Number);
          const [H, Mi, S] = (timePart || "00:00:00").split(":").map(Number);
          return { dateTime: new Date(y, m - 1, d, H, Mi, S || 0).toISOString() };
        };
        return { summary: ev.summary, start: mk(ev.dtstart), end: mk(ev.dtend), description: ev.description };
      }

      const card = document.createElement("family-week-planner-card");
      const useRowsHelper = new URLSearchParams(location.search).has("rows");
      const CARD_CONFIG = {
        title: "Familienwoche",
        entity: "calendar.familie",
        ...(useRowsHelper ? { persons_entity: "input_select.familienplaner_zeilen" } : {}),
        keyboard: true,
        icons_entity: "input_select.familienplaner_icons",
        todo_entities: [
          { entity: "todo.familienaufgaben", label: "Familie" },
          { entity: "todo.arbeit", label: "Arbeit", person: "Anna", icon: "Arbeit", prefix: false },
        ],
        persons: [
          { key: "Familie", color: "126,87,194", border: "#7e57c2", text: "#c9b3f0" },
          { key: "Anna", color: "30,136,229", border: "#1e88e5", text: "#8ecbff" },
          { key: "Ben", color: "236,64,122", border: "#ec407a", text: "#ff9ec4" },
          { key: "Carla", color: "0,137,123", border: "#00897b", text: "#5fd4c6", alpha: 0.15 },
          { key: "David", color: "251,140,0", border: "#fb8c00", text: "#ffca7a" },
          { key: "Essen", color: "109,76,65", border: "#6d4c41", text: "#c8b0a4", alpha: 0.16 },
          { key: "Rest", color: "84,110,122", border: "#546e7a", text: "#b0bec5", alpha: 0.14 },
        ],
      };
      card.setConfig(CARD_CONFIG);
      card.hass = mockHass;
      document.getElementById("stage").appendChild(card);
      window.__STORE = () => STORE;

      // Visual config editor (what HA shows under Dashboard -> Bearbeiten -> Karte). Changes are
      // applied to the live card above so the effect is visible immediately.
      let editor = null;
      window.__EDITOR = () => editor;
      document.getElementById("editor").onclick = () => {
        const host = document.getElementById("editorStage");
        if (editor) {
          host.innerHTML = "";
          editor = null;
          return;
        }
        editor = document.createElement("family-week-planner-card-editor");
        editor.hass = mockHass;
        editor.setConfig(CARD_CONFIG);
        editor.addEventListener("config-changed", (e) => {
          window.__LAST_CONFIG = e.detail.config;
          card.setConfig(e.detail.config);
          card.hass = mockHass;
          log(`config-changed: ${Object.keys(e.detail.config).join(", ")}`);
        });
        host.appendChild(editor);
      };

      document.getElementById("dump").onclick = () => {
        console.log("STORE", STORE);
        log(`${STORE.length} Einträge im Store (siehe Konsole)`);
      };
    </script>
  </body>
</html>
